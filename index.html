<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>时间账簿</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 12px 92px;background:#0f1216;color:#e7eaef;color-scheme:dark;
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header,main{max-width:720px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 10px}
header b{font-size:16px;letter-spacing:.5px}
header span{font-size:12px;color:#8d97a6}
.card{background:#171b21;border:1px solid #28303b;border-radius:14px;padding:14px;margin-bottom:10px}
.hint{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:#8d97a6;margin-bottom:8px}
.hint b{color:#e7eaef;font-size:16px}
.mut{color:#8d97a6}.sm{font-size:12px}
.big{font-size:42px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 12px}
.bar{height:6px;border-radius:9px;background:#1e242c;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:#5b8cff;border-radius:9px}
.bar.s{height:4px;margin:6px 0 0}
.two{display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:10px;border:1px solid #28303b;background:#1e242c;color:#e7eaef;font:inherit;font-size:14px;cursor:pointer}
.btn.p{background:#5b8cff;border-color:#5b8cff;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.cb{display:flex;align-items:center;gap:8px;padding:11px;border-radius:12px;border:1px solid #28303b;
 background:#171b21;color:#e7eaef;font:inherit;text-align:left;cursor:pointer}
.cb .n{flex:1;font-size:13px;line-height:1.25}
.cb .m{font-size:12px;color:#8d97a6;font-variant-numeric:tabular-nums}
.cb.on{border-color:#5b8cff}
i.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
label{display:block;font-size:12px;color:#8d97a6;margin-bottom:8px}
input,select{width:100%;margin-top:4px;padding:9px 10px;border-radius:9px;border:1px solid #28303b;
 background:#1e242c;color:#e7eaef;font:inherit;font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid #28303b;background:#1e242c;color:#8d97a6;font:inherit;font-size:12px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #222a33}
.row:last-child{border-bottom:0}
.row .t{width:38px;flex:none;font-size:12px;color:#8d97a6;font-variant-numeric:tabular-nums}
.row .n{flex:1;min-width:0;font-size:13px}
.row .n em{display:block;font-style:normal;font-size:12px;color:#8d97a6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d{font-size:13px;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:#8d97a6;font-size:17px;padding:0 4px;cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid #28303b;background:#171b21;color:#8d97a6;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:#5b8cff;border-color:#5b8cff;color:#fff}
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rh b{font-size:15px;font-variant-numeric:tabular-nums}
.ar{width:34px;height:34px;border-radius:10px;border:1px solid #28303b;background:#171b21;color:#e7eaef;font-size:15px;cursor:pointer}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.k{background:#171b21;border:1px solid #28303b;border-radius:12px;padding:12px}
.k .a{font-size:12px;color:#8d97a6}
.k .b2{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.k .c{font-size:11px;color:#8d97a6}
.cr{padding:9px 0;border-bottom:1px solid #222a33}
.cr:last-child{border-bottom:0}
.cr .h{display:flex;align-items:center;gap:8px;font-size:13px}
.cr .h b{flex:1;font-weight:500}
.cr .h span{font-variant-numeric:tabular-nums;font-size:13px}
.cr .f{display:flex;justify-content:space-between;font-size:11px;color:#8d97a6;margin-top:3px}
.ch{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:10px}
.ch div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.ch div i{display:block;background:#5b8cff;border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
pre{white-space:pre-wrap;word-break:break-word;background:#1e242c;border:1px solid #28303b;border-radius:10px;
 padding:12px;font:12.5px/1.85 ui-monospace,Menlo,Consolas,monospace;margin:0 0 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(18,22,27,.97);
 border-top:1px solid #28303b;padding:8px 0 calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
nav button{flex:1;background:none;border:0;color:#8d97a6;font:inherit;font-size:12.5px;cursor:pointer}
nav button.on{color:#5b8cff}
</style></head><body>
<header><b>时间账簿</b><span id="hd"></span></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var CATS=[{"id": "k1", "name": "Work · PINN", "kind": "work", "color": "#5b8cff", "budget": 180}, {"id": "k2", "name": "Work · 横向", "kind": "work", "color": "#22c58b", "budget": 120}, {"id": "k3", "name": "Work · AI", "kind": "work", "color": "#f5a524", "budget": 45}, {"id": "k4", "name": "Work · SSG", "kind": "work", "color": "#a06bff", "budget": 45}, {"id": "k5", "name": "学习 · 读书", "kind": "work", "color": "#38bdf8", "budget": 45}, {"id": "k6", "name": "健身", "kind": "body", "color": "#ff6b81", "budget": 60}, {"id": "k7", "name": "生活 · 吃行杂务", "kind": "life", "color": "#94a3b8", "budget": 150}, {"id": "k8", "name": "躺着 · 睡觉", "kind": "sleep", "color": "#64748b", "budget": 450}, {"id": "k9", "name": "损耗 · 刷手机", "kind": "waste", "color": "#78716c", "budget": 0}], DAYOFF=4, KEY='timebook_v1', DAY=86400000;
function $(id){return document.getElementById(id)}
function pad(n){return('0'+n).slice(-2)}
function dnum(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])}
function ds(n){var d=new Date(n);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function hhmm(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())}
function hm(m){m=Math.round(m||0);var h=Math.floor(m/60),r=m%60;return h?(h+'h'+(r?r+'m':'')):m+'m'}
function hmL(m){m=Math.round(m||0);var h=Math.floor(m/60),r=m%60,s='';if(h)s+=h+' 小时';if(r||!h)s+=(s?' ':'')+r+' 分';return s}
function elas(ms){var t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
 return(h?h+':':'')+pad(m)+':'+pad(s)}
function pct(a,b){return b>0?Math.round(a/b*100):0}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function def(){return{cats:CATS.map(function(c){return{id:c.id,name:c.name,kind:c.kind,color:c.color,budget:c.budget}}),
 entries:[],timer:null,ui:{tab:'rec',range:'day',anchor:0,lastCat:CATS[0].id,lastMin:30}}}
function load(){var d=def();try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return d;
 d.entries=s.entries||[];d.timer=s.timer||null;if(s.cats&&s.cats.length)d.cats=s.cats;if(s.ui)d.ui=s.ui;return d}catch(e){return d}}
var st=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
/* 一天的起点：凌晨 DAYOFF 点前算前一天 */
function ldate(t){var d=new Date((t||Date.now())-DAYOFF*3600000);
 return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ldate(Date.now())}
function todayN(){return dnum(todayStr())}
function cat(id){for(var i=0;i<st.cats.length;i++)if(st.cats[i].id===id)return st.cats[i];
 return{id:id,name:'(已删除)',kind:'life',color:'#888',budget:0}}
function skey(e){var p=e.t.split(':');var k=(+p[0])*60+(+p[1])-DAYOFF*60;return k<0?k+1440:k}
function entriesOn(d){return st.entries.filter(function(e){return e.d===d}).sort(function(a,b){return skey(a)-skey(b)})}
function byCat(es){var m={};es.forEach(function(e){m[e.cat]=(m[e.cat]||0)+e.min});return m}
function sumKind(es,k){var m=byCat(es),t=0;st.cats.forEach(function(c){if(c.kind===k)t+=(m[c.id]||0)});return t}
function addEntry(d,t,min,cid,note){st.entries.push({id:uid(),d:d,t:t,min:Math.max(1,Math.round(min)),cat:cid,note:note||''});save()}
function start(cid){if(st.timer)stop();st.timer={catId:cid,start:Date.now()};save();render()}
function stop(now){now=now||Date.now();var t=st.timer;if(!t)return;
 addEntry(ldate(t.start),hhmm(t.start),Math.max(1,(now-t.start)/60000),t.catId,'');st.timer=null;save();render()}
/* 区间 */
function rangeInfo(r,a){var t=todayN(),s,e,i,out=[];
 if(r==='day'){s=t+a*DAY;return{start:s,end:s,days:[ds(s)]}}
 if(r==='week'){var dow=(new Date(t).getUTCDay()+6)%7;s=t-dow*DAY+a*7*DAY;e=s+6*DAY}
 else if(r==='month'){var d=new Date(t),y=d.getUTCFullYear(),m=d.getUTCMonth()+a;
  s=Date.UTC(y,m,1);e=Date.UTC(y,m+1,0)}
 else{var yy=new Date(t).getUTCFullYear()+a;s=Date.UTC(yy,0,1);e=Date.UTC(yy+1,0,0)}
 for(i=0;i<Math.round((e-s)/DAY)+1;i++)out.push(ds(s+i*DAY));
 return{start:s,end:e,days:out}}
function rlabel(r,info){var wk='日一二三四五六';
 if(r==='day')return info.days[0]+' 周'+wk[new Date(info.start).getUTCDay()];
 if(r==='week')return info.days[0].slice(5)+' ~ '+info.days[6].slice(5);
 if(r==='month'){var d=new Date(info.start);return d.getUTCFullYear()+' 年 '+(d.getUTCMonth()+1)+' 月'}
 return new Date(info.start).getUTCFullYear()+' 年'}
function inRange(info){return st.entries.filter(function(e){var n=dnum(e.d);return n>=info.start&&n<=info.end})}

/* ========== 记录页 ========== */
function viewRec(){
 var td=todayStr(),es=entriesOn(td),b=byCat(es),tot=0;
 es.forEach(function(e){tot+=e.min});
 var w=sumKind(es,'work'),tg=0;
 st.cats.forEach(function(c){if(c.kind==='work')tg+=(c.budget||0)});
 var head;
 if(st.timer){var c=cat(st.timer.catId);
  head='<div class="card"><div class="hint"><span><i class="dot" style="background:'+c.color+'"></i> <b>'+esc(c.name)+'</b> 计时中</span></div>'+
   '<div class="big" id="el">'+elas(Date.now()-st.timer.start)+'</div>'+
   '<div class="two"><button class="btn p" data-a="stop">结束并记账</button><button class="btn" data-a="cancel">作废</button></div></div>';
 }else{
  head='<div class="card"><div class="hint"><span>今日净工作 <b>'+hm(w)+'</b> <span class="mut">/ 目标 '+hm(tg)+'</span></span></div>'+
   '<div class="bar"><i style="width:'+Math.min(100,pct(w,tg))+'%"></i></div>'+
   '<div class="mut sm">点分类开始计时；切到别的分类会自动结算上一段。</div></div>';
 }
 var grid=st.cats.map(function(c){
  var m=b[c.id]||0,on=(st.timer&&st.timer.catId===c.id)?' on':'';
  return '<button class="cb'+on+'" data-a="start" data-v="'+c.id+'">'+
   '<i class="dot" style="background:'+c.color+'"></i><span class="n">'+esc(c.name)+'</span>'+
   '<span class="m">'+(m?hm(m):'—')+'</span></button>'}).join('');
 var opts=st.cats.map(function(c){
  return '<option value="'+c.id+'"'+(c.id===st.ui.lastCat?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
 var chips=[10,15,25,30,45,60,90,120].map(function(m){
  return '<button class="chip" data-a="chip" data-v="'+m+'">'+m+' 分</button>'}).join('');
 var form='<div class="card"><div class="hint"><span>补记一笔</span></div>'+
  '<div class="g2"><label>日期<input type="date" id="mD" value="'+td+'"></label>'+
  '<label>开始<input type="time" id="mT" value="'+hhmm(Date.now())+'"></label></div>'+
  '<div class="chips">'+chips+'</div>'+
  '<div class="g2"><label>时长(分钟)<input type="number" id="mM" min="1" step="5" value="'+(st.ui.lastMin||30)+'"></label>'+
  '<label>分类<select id="mC">'+opts+'</select></label></div>'+
  '<label>备注<input type="text" id="mN" placeholder="具体做了什么"></label>'+
  '<button class="btn p" data-a="add" style="width:100%">记入账簿</button></div>';
 var rows=es.map(function(e){
  var c=cat(e.cat);
  return '<div class="row"><span class="t">'+esc(e.t)+'</span><i class="dot" style="background:'+c.color+'"></i>'+
   '<span class="n"><b>'+esc(c.name)+'</b>'+(e.note?'<em>'+esc(e.note)+'</em>':'')+'</span>'+
   '<span class="d">'+hm(e.min)+'</span><button class="x" data-a="del" data-v="'+e.id+'">×</button></div>'}).join('')
  ||'<div class="mut sm" style="text-align:center;padding:12px">今天还没记录</div>';
 return head+'<div class="grid">'+grid+'</div>'+form+
  '<div class="card"><div class="hint"><span>今日流水</span><span>'+es.length+' 笔 · 合计 '+hm(tot)+'</span></div>'+rows+'</div>';
}

/* ========== 统计页 ========== */
function viewStat(){
 var r=st.ui.range,a=st.ui.anchor,info=rangeInfo(r,a),es=inRange(info),b=byCat(es),tot=0;
 es.forEach(function(e){tot+=e.min});
 var dn=info.days.filter(function(d){return dnum(d)<=todayN()}).length||1;
 var w=sumKind(es,'work'),bd=sumKind(es,'body'),sl=sumKind(es,'sleep'),wa=sumKind(es,'waste');
 var tg=0;st.cats.forEach(function(c){if(c.kind==='work')tg+=(c.budget||0)});
 var head='<div class="seg">'+[['day','日'],['week','周'],['month','月'],['year','年']].map(function(x){
   return '<button class="'+(r===x[0]?'on':'')+'" data-a="range" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'+
  '<div class="rh"><button class="ar" data-a="nav" data-v="-1">‹</button><b>'+esc(rlabel(r,info))+
   '</b><button class="ar" data-a="nav" data-v="1">›</button></div>';
 var kp='<div class="kp">'+
  '<div class="k"><div class="a">净工作(产出)</div><div class="b2">'+hm(w)+'</div><div class="c">日均 '+hm(w/dn)+' · 目标 '+hm(tg)+' · 达成 '+pct(w/dn,tg)+'%</div></div>'+
  '<div class="k"><div class="a">记录覆盖</div><div class="b2">'+pct(tot,dn*1440)+'%</div><div class="c">合计 '+hm(tot)+' / 可用 '+hm(dn*1440)+'</div></div>'+
  '<div class="k"><div class="a">损耗</div><div class="b2">'+hm(wa)+'</div><div class="c">占比 '+pct(wa,tot)+'%</div></div>'+
  '<div class="k"><div class="a">睡眠 / 健身</div><div class="b2">'+hm(sl)+' / '+hm(bd)+'</div><div class="c">日均 睡 '+hm(sl/dn)+' · 练 '+hm(bd/dn)+'</div></div></div>';
 var rows=st.cats.map(function(c){
  var m=b[c.id]||0;if(!m&&!c.budget)return'';
  var per=m/dn,bud=c.budget||0,rate=bud?Math.round(per/bud*100):0;
  var wid=bud?Math.min(100,rate):pct(m,tot);
  return '<div class="cr"><div class="h"><i class="dot" style="background:'+c.color+'"></i><b>'+esc(c.name)+'</b>'+
   '<span>'+hm(m)+' · '+pct(m,tot)+'%</span></div>'+
   '<div class="bar s"><i style="width:'+wid+'%;background:'+c.color+'"></i></div>'+
   '<div class="f"><span>日均 '+hm(per)+'</span><span>'+(bud?'预算 '+hm(bud)+'/天 · 达成 '+rate+'%':'未设预算')+'</span></div></div>'}).join('')
  ||'<div class="mut sm">这段时间没有记录</div>';
 var ch='';
 if(r!=='day'){
  var dm={};es.forEach(function(e){(dm[e.d]=dm[e.d]||{})[e.cat]=(dm[e.d][e.cat]||0)+e.min});
  var vals=info.days.map(function(d){var m=dm[d]||{},t=0;
   st.cats.forEach(function(c){if(c.kind==='work')t+=(m[c.id]||0)});return t});
  var mx=Math.max(60,Math.max.apply(null,vals));
  ch='<div class="card"><div class="hint"><span>每日净工作</span><span>峰值 '+hm(mx)+'</span></div><div class="ch">'+
   vals.map(function(v,i){return '<div title="'+info.days[i]+' '+hm(v)+'"><i style="height:'+
    Math.max(2,Math.round(v/mx*100))+'%"></i></div>'}).join('')+'</div></div>';
 }
 var rep=reportText(r,info,es);
 return head+kp+'<div class="card"><div class="hint"><span>分类统计</span><span>日均按 '+dn+' 天计</span></div>'+rows+'</div>'+ch+
  '<div class="card"><div class="hint"><span>文字小结</span><button class="chip" data-a="copy">复制</button></div>'+
  '<pre id="rep">'+esc(rep)+'</pre><div class="mut sm">贴进日记 / Obsidian 就是当天的柳比歇夫日志。</div></div>';
}
function reportText(r,info,es){
 var wk='日一二三四五六',L=[],by=byCat(es);
 if(r==='day'){
  L.push(info.days[0]+' 周'+wk[new Date(info.start).getUTCDay()]);L.push('');
  var s=es.slice().sort(function(a,b){return skey(a)-skey(b)});
  if(!s.length)L.push('(无记录)');
  s.forEach(function(e){var c=cat(e.cat);
   L.push(e.t+'  '+c.name+(e.note?'('+e.note+')':'')+' —— '+hmL(e.min))});
  L.push('');
  st.cats.forEach(function(c){var m=by[c.id]||0;if(m)L.push('　'+c.name+' 合计 —— '+hmL(m))});
  L.push('');L.push('基本工作(产出)合计 —— '+hmL(sumKind(es,'work')));
 }else{
  L.push(rlabel(r,info)+' 小结');L.push('');
  st.cats.forEach(function(c){var m=by[c.id]||0;if(m)L.push(c.name+' —— '+hmL(m))});
  var tot=0;es.forEach(function(e){tot+=e.min});
  L.push('');L.push('记录合计 —— '+hmL(tot));L.push('基本工作(产出)合计 —— '+hmL(sumKind(es,'work')));
 }
 return L.join('\n');
}

/* ========== 设置页 ========== */
function viewSet(){
 var rows=st.cats.map(function(c){
  return '<div class="g2" style="margin-bottom:8px">'+
   '<input type="text" value="'+esc(c.name)+'" data-a="catname" data-v="'+c.id+'">'+
   '<input type="number" value="'+(c.budget||0)+'" min="0" step="15" data-a="catbudget" data-v="'+c.id+'" title="每日预算分钟"></div>'}).join('');
 return '<div class="card"><div class="hint"><span>分类名称 / 每日预算(分钟)</span></div>'+
  '<div class="mut sm" style="margin-bottom:10px">预算填 0 不考核。增删分类请改 timebook.py 里的 CATS，重新运行后点下面的「重置分类」。</div>'+
  rows+'<button class="btn" data-a="reset" style="width:100%;margin-top:6px">重置分类(按脚本)</button></div>'+
  '<div class="card"><div class="hint"><span>数据</span><span>'+st.entries.length+' 条记录</span></div>'+
  '<div class="two" style="margin-bottom:8px"><button class="btn" data-a="csv">导出 CSV</button>'+
  '<button class="btn" data-a="json">导出 JSON</button></div>'+
  '<div class="two"><button class="btn" data-a="imp">导入 JSON</button></div>'+
  '<input type="file" id="fi" accept=".json,application/json" style="display:none">'+
  '<div class="mut sm" style="margin-top:10px">手机和电脑之间：A 机导出 JSON → 发给自己(微信文件传输助手/iCloud) → B 机导入，同 id 自动去重合并。数据存在浏览器本地，定期导出备份。</div></div>'+
  '<div class="card"><div class="hint"><span>柳比歇夫的五条铁律</span></div><div class="mut sm" style="line-height:1.9">'+
  '1 事情一结束就记，误差别超过 15 分钟，不靠回忆补。<br>'+
  '2 只记「做了什么 + 多久」，不评价、不写情绪。<br>'+
  '3 每天只盯一个数：<b>净工作</b>。别盯总忙碌时长。<br>'+
  '4 每周看一次分类统计，找出「损耗」里能砍掉的部分。<br>'+
  '5 预算先按真实日均填，再每周把产出类上调 10%，别一步到位。</div></div>';
}

/* ========== 渲染 & 事件 ========== */
function render(){
 var t=st.ui.tab;
 $('app').innerHTML=(t==='stat')?viewStat():(t==='set'?viewSet():viewRec());
 $('nav').innerHTML=[['rec','记录'],['stat','统计'],['set','设置']].map(function(x){
  return '<button class="'+(t===x[0]?'on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('');
 $('hd').textContent=todayStr()+' · '+hhmm(Date.now())+(st.timer?' · 计时中':'');
 save();
}
document.addEventListener('click',function(ev){
 var n=ev.target.closest?ev.target.closest('[data-a]'):null;if(!n)return;
 var a=n.dataset.a,v=n.dataset.v;
 if(a==='tab'){st.ui.tab=v;render()}
 else if(a==='start'){start(v)}
 else if(a==='stop'){stop()}
 else if(a==='cancel'){if(confirm('作废这一段计时？')){st.timer=null;save();render()}}
 else if(a==='del'){if(confirm('删除这条记录？')){st.entries=st.entries.filter(function(e){return e.id!==v});save();render()}}
 else if(a==='chip'){$('mM').value=v}
 else if(a==='add'){manual()}
 else if(a==='range'){st.ui.range=v;st.ui.anchor=0;render()}
 else if(a==='nav'){st.ui.anchor+=Number(v);render()}
 else if(a==='copy'){copyRep(n)}
 else if(a==='csv'){expCSV()}
 else if(a==='json'){expJSON()}
 else if(a==='imp'){$('fi').click()}
 else if(a==='reset'){if(confirm('按 timebook.py 里的 CATS 重置分类？记录会保留。')){st.cats=def().cats;save();render()}}
});
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.id==='fi'){doImport(t);return}
 var a=t.dataset.a;if(!a)return;
 if(a==='catname'||a==='catbudget'){
  for(var i=0;i<st.cats.length;i++)if(st.cats[i].id===t.dataset.v){
   if(a==='catname')st.cats[i].name=t.value.trim()||st.cats[i].name;
   else st.cats[i].budget=Math.max(0,Number(t.value)||0);
   break}
  save();render()}
});
function manual(){
 var d=$('mD').value||todayStr(),t=$('mT').value||hhmm(Date.now());
 var m=Number($('mM').value)||0,c=$('mC').value,n=($('mN').value||'').trim();
 if(m<=0){alert('时长要大于 0 分钟');return}
 addEntry(d,t,m,c,n);st.ui.lastCat=c;st.ui.lastMin=m;save();render();
}
function copyRep(n){
 var txt=$('rep').textContent;
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(function(){n.textContent='已复制';setTimeout(function(){n.textContent='复制'},1200)});
 }else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch(e){}ta.remove();n.textContent='已复制'}
}
function dl(name,text,type){
 var b=new Blob([text],{type:type||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b);
 var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500)}
function expCSV(){
 var L=['日期,开始时间,分类,类型,时长(分钟),时长(小时),备注'];
 var KIND={work:'产出',body:'身体',life:'生活',sleep:'睡眠',waste:'损耗'};
 var all=st.entries.slice().sort(function(a,b){return a.d===b.d?skey(a)-skey(b):(a.d<b.d?-1:1)});
 all.forEach(function(e){var c=cat(e.cat);
  L.push([e.d,e.t,c.name,KIND[c.kind]||'',e.min,(e.min/60).toFixed(2),'"'+String(e.note||'').replace(/"/g,'""')+'"'].join(','))});
 dl('时间账簿_'+todayStr()+'.csv','\ufeff'+L.join('\r\n'),'text/csv;charset=utf-8')}
function expJSON(){dl('时间账簿_备份_'+todayStr()+'.json',JSON.stringify(st,null,2),'application/json')}
function doImport(input){
 var f=input.files&&input.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){
  try{
   var s=JSON.parse(r.result),inc=Array.isArray(s)?s:(s.entries||[]);
   if(!inc.length){alert('文件里没有记录');return}
   var have={};st.entries.forEach(function(e){have[e.id]=1});
   var add=0;
   inc.forEach(function(e){
    if(!e||!e.d||!e.cat)return;
    if(!have[e.id]){st.entries.push({id:e.id||uid(),d:e.d,t:e.t||'00:00',min:Number(e.min)||1,cat:e.cat,note:e.note||''});have[e.id]=1;add++}
   });
   save();render();alert('导入完成，新增 '+add+' 条记录');
  }catch(err){alert('解析失败：'+err.message)}
  input.value='';
 };
 r.readAsText(f)}
render();
setInterval(function(){if(!st.timer)return;var e=$('el');if(e)e.textContent=elas(Date.now()-st.timer.start)},1000);
</script></body></html>
